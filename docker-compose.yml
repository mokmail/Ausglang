# SGLang Workbench — docker compose
#
#   ./start-workbench.sh          # recommended: writes .env with this host's address, then up
#   docker compose up -d --build  # plain compose, using whatever .env already says
#
# The workbench is GPU-agnostic: it speaks the OpenAI API to an SGLang server that
# stays on the host (Metal on macOS, CUDA on Linux, WSL2 on Windows). The container
# does not need a GPU, a driver or a special image.
#
# Linux + NVIDIA: run SGLang in its own container instead:
#   docker compose --profile gpu up -d     # engine on :30000, workbench auto-discovers it
#
# Everything is configurable through .env (copy .env.example). Nothing here is
# specific to one machine: no hard-coded user paths, no fixed LAN address.

name: sglang-workbench

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: sglang-workbench:2.0.0
    container_name: ${WORKBENCH_CONTAINER:-sglang-workbench}
    ports:
      - "${WORKBENCH_PORT:-8090}:8090"
    environment:
      # Where SGLang lives. If this address is wrong the app probes the usual
      # suspects (host.docker.internal, the docker gateway, loopback) and reports
      # what it found at /api/upstream — see the README troubleshooting table.
      UPSTREAM: ${UPSTREAM:-http://host.docker.internal:43440}
      WORKBENCH_UPSTREAMS: ${WORKBENCH_UPSTREAMS:-}
      WORKBENCH_LOADER_URL: ${WORKBENCH_LOADER_URL:-}
      WORKBENCH_LOADER_TOKEN: ${WORKBENCH_LOADER_TOKEN:-}
      WORKBENCH_API_KEY: ${WORKBENCH_API_KEY:-}
      WORKBENCH_CORS_ORIGINS: ${WORKBENCH_CORS_ORIGINS:-*}
      WORKBENCH_DATA: /data
      WORKBENCH_ROOT: /app
      SGLANG_PYTHON: ${SGLANG_PYTHON:-}
      HF_HOME: /hf-cache
      TZ: ${TZ:-UTC}
    volumes:
      - "${WORKBENCH_DATA_DIR:-./data}:/data"
      # Read-only model cache, so "Downloaded" in the model browser shows what the
      # host already has. Leave unset on machines without a HuggingFace cache.
      - "${HF_CACHE_DIR:-./.hf-cache}:/hf-cache:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: SGLang in a container. Linux + NVIDIA only (Metal cannot run here).
  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:latest}
    container_name: ${SGLANG_CONTAINER:-sglang-server}
    profiles: ["gpu"]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - ${MODEL:-Qwen/Qwen3-1.7B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - ${MEM_FRACTION:-0.85}
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    shm_size: "16gb"
    ipc: host
    volumes:
      - "${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
